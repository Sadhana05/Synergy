<!-- Advanced Styled HTML Code with Greetings -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greetings</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
    }

    .greeting-container {
      width: 80%;
      margin: 40px auto;
      text-align: center;
      background-color: #fff;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    .greeting {
      font-size: 24px;
      font-weight: bold;
      color: #333;
    }

    .message {
      font-size: 18px;
      color: #666;
    }
  </style>
</head>

<body>
  <div class="greeting-container">
    <h1 class="greeting">Hello, World!</h1>
    <p class="message">Welcome to our website. We're glad you're here.</p>
  </div>
</body>

</html>
